<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Controle de Ponto</title>
<style>
:root{--p:#0f766e;--p2:#14b8a6;--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ok:#16a34a;--wa:#d97706;--er:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{background:var(--p);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header .hb{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:14px}
h2{margin:0 0 12px;font-size:20px}
.clock{text-align:center;padding:10px 0 18px}
.clock .t{font-size:clamp(40px,10vw,72px);font-weight:700;font-variant-numeric:tabular-nums}
.clock .d{color:var(--mu);font-size:16px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.grid.g2{grid-template-columns:1fr 1fr}.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g4{grid-template-columns:repeat(4,1fr)}}
.big{border:0;border-radius:18px;padding:26px 16px;font-size:20px;font-weight:700;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:120px}
.big small{font-weight:400;opacity:.9;font-size:13px}
.big.g{background:#16a34a}.big.b{background:#2563eb}.big.o{background:#7c3aed}.big.k{background:#334155}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;background:var(--p);color:#fff}
.btn.sec{background:#e2e8f0;color:var(--tx)}.btn.red{background:var(--er)}.btn.sm{padding:7px 12px;font-size:14px}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:#fff;color:var(--tx)}
input[type=checkbox]{width:auto}
.fgrid{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:640px){.fgrid{grid-template-columns:1fr 1fr}}
.cam{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-width:560px;margin:0 auto}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .ring{position:absolute;inset:12% 25%;border:4px dashed rgba(255,255,255,.7);border-radius:50%;pointer-events:none}
.cam .st{position:absolute;left:0;right:0;bottom:0;padding:10px;background:rgba(0,0,0,.6);color:#fff;text-align:center;font-weight:600}
.cam .st.ok{background:rgba(22,163,74,.85)}.cam .st.warn{background:rgba(217,119,6,.85)}
.photo{width:96px;height:96px;border-radius:14px;object-fit:cover;background:#e2e8f0}
.photo.lg{width:150px;height:150px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.badge.ok{background:#dcfce7;color:#166534}.badge.off{background:#fee2e2;color:#991b1b}.badge.wa{background:#fef3c7;color:#92400e}
.stat{text-align:center}.stat b{display:block;font-size:32px}.stat span{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.tabs button{border:0;background:#e2e8f0;border-radius:99px;padding:9px 16px;font-size:15px;font-weight:600;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--p);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{color:var(--mu);font-size:12px;text-transform:uppercase}
@media(max-width:700px){table,thead,tbody,tr,td{display:block}thead{display:none}tr{border:1px solid var(--bd);border-radius:12px;padding:6px;margin-bottom:10px}td{border:0;display:flex;justify-content:space-between;gap:10px;padding:5px 8px}td::before{content:attr(data-l);color:var(--mu);font-weight:600}}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.types button{border:2px solid var(--bd);background:#fff;border-radius:14px;padding:16px 8px;font-size:16px;font-weight:700;cursor:pointer}
.types button.on{border-color:var(--p);background:#ccfbf1;color:var(--p)}
.rec{text-align:center}
.rec .tp{font-size:34px;font-weight:800;color:var(--p);margin:6px 0}
.rec .big-ok{font-size:60px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;z-index:50;max-width:90%}
.toast.er{background:var(--er)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal>div{background:#fff;border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{overscroll-behavior-y:contain;padding-bottom:env(safe-area-inset-bottom)}
header{padding-top:max(12px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.btn,.big,.tabs button,.types button,.hb{min-height:48px;touch-action:manipulation;user-select:none}
.tabs{-webkit-overflow-scrolling:touch;scrollbar-width:none}
.row>.btn{flex:0 0 auto}
@media(max-width:480px){main{padding:10px}.card{padding:12px;border-radius:14px}h2{font-size:18px}.big{min-height:96px;padding:16px 10px;font-size:17px;flex-direction:row;justify-content:flex-start;text-align:left;gap:14px}.big small{display:none}.big span{font-size:30px!important}.row{gap:8px}.row>.btn{flex:1 1 100%}.row>.btn.sm{flex:1 1 auto}.photo.lg{width:110px;height:110px}.types button{padding:14px 6px;font-size:15px}.clock{padding:4px 0 10px}.cam{border-radius:12px}.cam .ring{inset:10% 18%}}
@media(min-width:768px){main{padding:24px}header h1{font-size:22px}.big{min-height:150px;font-size:24px}.big small{font-size:15px}.btn{font-size:18px}input,select{padding:14px;font-size:18px}label{font-size:14px}.cam{max-width:680px}.card{padding:22px}}
@media(min-width:900px) and (orientation:landscape){.cam{max-width:760px}.rec,.card.rec{max-width:640px!important}}
@media(orientation:landscape) and (max-height:520px){header{padding-top:6px;padding-bottom:6px}.clock .t{font-size:44px}.clock{padding:0 0 6px}.big{min-height:84px;padding:10px}.cam{max-width:360px}.punchrow{display:flex;gap:14px;align-items:center}}
@media(display-mode:standalone){body{user-select:none}input{user-select:text}}
.mu{color:var(--mu);font-size:13px}.warn{background:#fef3c7;border-radius:10px;padding:10px;font-size:13px;color:#92400e}
</style>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js" defer onerror="window.FACE_FAIL=1"></script>
</head>
<body>
<div id="app"></div>
<script>
/* ===== utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const p2=n=>String(n).padStart(2,'0');
const dKey=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const fDate=d=>`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;
const fTime=d=>`${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
const digits=s=>String(s||'').replace(/\D/g,'');
const maskCpfIn=v=>{v=digits(v).slice(0,11);return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')};
const maskWppIn=v=>{v=digits(v).slice(0,11);if(v.length>6)return v.replace(/(\d{2})(\d{4,5})(\d{4})$/,'($1) $2-$3');if(v.length>2)return v.replace(/(\d{2})(\d+)/,'($1) $2');return v};
const cpfMasked=c=>{c=digits(c);return `***.${c.slice(3,6)}.${c.slice(6,9)}-**`};
function cpfOk(c){c=digits(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if(((s*10)%11)%10!=c[t])return false}return true}
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const ch of t)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return 'x'+h.toString(16)}}
const TYPES={ENTRADA:'Entrada',INTERVALO:'Saída p/ intervalo',RETORNO:'Retorno do intervalo',SAIDA:'Saída'};
const SEQ=['ENTRADA','INTERVALO','RETORNO','SAIDA'];
const WMSG={ENTRADA:'Registro de entrada realizado.',INTERVALO:'Registro de saída para intervalo realizado.',RETORNO:'Registro de retorno do intervalo realizado.',SAIDA:'Registro de saída realizado.'};

/* ===== banco (IndexedDB) ===== */
const DB={db:null,open(){return new Promise((res,rej)=>{const r=indexedDB.open('ponto-v1',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('employees',{keyPath:'id'});d.createObjectStore('punches',{keyPath:'id'});d.createObjectStore('audit',{keyPath:'id',autoIncrement:true});d.createObjectStore('kv',{keyPath:'key'})};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
tx(s,m,f){return new Promise((res,rej)=>{const t=this.db.transaction(s,m);const st=t.objectStore(s);const q=f(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
all(s){return this.tx(s,'readonly',st=>st.getAll())},get(s,k){return this.tx(s,'readonly',st=>st.get(k))},put(s,v){return this.tx(s,'readwrite',st=>st.put(v))},del(s,k){return this.tx(s,'readwrite',st=>st.delete(k))},clear(s){return this.tx(s,'readwrite',st=>st.clear())}};
const DEF={company:'Minha Empresa',device:'Tablet Portaria',webhook:'',threshold:0.5,liveness:true,pw:null,salt:null};
let S={...DEF};
async function loadSettings(){const r=await DB.get('kv','settings');S={...DEF,...(r?r.value:{})}}
const saveSettings=()=>DB.put('kv',{key:'settings',value:S});
async function audit(action,detail=''){await DB.put('audit',{ts:new Date().toISOString(),user:state.admin?'admin':'dispositivo',action,detail})}

/* ===== câmera e rosto ===== */
const Cam={stream:null,async start(v){this.stop();if(!navigator.mediaDevices?.getUserMedia)return 'Câmera indisponível. Abra o app via HTTPS.';try{this.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});v.srcObject=this.stream;await v.play();return true}catch(e){return 'Não foi possível acessar a câmera: '+e.message}},
stop(){this.stream?.getTracks().forEach(t=>t.stop());this.stream=null},
snap(v){if(!v||!v.videoWidth)return null;const c=document.createElement('canvas');c.width=320;c.height=Math.round(320*v.videoHeight/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7)}};
const MODELS='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
const Face={ready:false,p:null,err:'',async load(){if(this.ready)return true;if(!window.faceapi){this.err='biblioteca não carregou (sem acesso ao CDN jsdelivr)';return false}if(!this.p)this.p=(async()=>{try{if(faceapi.tf&&faceapi.tf.ready)await faceapi.tf.ready();await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),faceapi.nets.faceRecognitionNet.loadFromUri(MODELS)]);this.ready=true;return true}catch(e){this.err='modelos não baixaram: '+(e.message||e);this.p=null;return false}})();return this.p},
detect(v){return faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor()}};
const ear=pts=>{const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);return (d(pts[1],pts[5])+d(pts[2],pts[4]))/(2*d(pts[0],pts[3]))};
function bestMatch(desc,emps){let b=null;for(const e of emps){if(e.status!=='ativo'||!e.descriptor)continue;const d=faceapi.euclideanDistance(desc,e.descriptor);if(!b||d<b.dist)b={emp:e,dist:d}}return b}

/* ===== estado e navegação ===== */
const state={screen:'home',admin:false,tab:'painel',form:null,punch:null,next:null,hist:null,modal:null};
let idle=null;
function go(s,extra={}){Cam.stop();state.punch&&(state.punch.token=0);Object.assign(state,{screen:s,modal:null},extra);render()}
function guard(s,extra){if(state.admin)go(s,extra);else go('login',{next:{s,extra}})}
function toast(m,er){const t=document.createElement('div');t.className='toast'+(er?' er':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function bumpIdle(){clearTimeout(idle);if(state.admin)idle=setTimeout(()=>{state.admin=false;toast('Sessão encerrada por inatividade');go('home')},5*60000)}

const TITLES={home:'Controle de Ponto',login:'Administrador',form:'Cadastro de colaborador',punch:'Marcar ponto',hist:'Registros',admin:'Administração'};
function header(){return `<header>${state.screen!=='home'?'<button class="hb" data-a="home">←</button>':''}<h1>${esc(TITLES[state.screen])}</h1><button class="hb" data-a="fs" title="Tela cheia">⛶</button>${state.admin?'<button class="hb" data-a="logout">Sair</button>':''}</header>`}
function render(){const body=SCR[state.screen]();$('#app').innerHTML=header()+`<main>${body}</main>`+(state.modal||'');(AFTER[state.screen]||(()=>{}))()}

/* ===== TELA: início ===== */
const SCR={},AFTER={};
SCR.home=()=>`<div class="clock"><div class="t" id="clk">--:--:--</div><div class="d" id="cdt"></div></div>
<div class="grid g2">
<button class="big g" data-a="punch"><span style="font-size:38px">🟢</span>MARCAR PONTO<small>Câmera + reconhecimento facial</small></button>
<button class="big b" data-a="newEmp"><span style="font-size:38px">👤</span>CADASTRAR COLABORADOR<small>Requer login de administrador</small></button>
<button class="big o" data-a="hist"><span style="font-size:38px">📋</span>CONSULTAR REGISTROS<small>Histórico e exportação CSV</small></button>
<button class="big k" data-a="admin"><span style="font-size:38px">⚙️</span>ADMINISTRAÇÃO<small>Painel, colaboradores e configurações</small></button></div>
<p class="mu" style="text-align:center">${esc(S.company)} · ${esc(S.device)} · Reconhecimento facial: <span id="fst">verificando…</span></p>`;
AFTER.home=()=>{const tick=()=>{const n=new Date(),c=$('#clk');if(!c){return}c.textContent=fTime(n);$('#cdt').textContent=n.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});setTimeout(tick,500)};tick();
const chk=async()=>{const el=$('#fst');if(!el)return;if(window.FACE_FAIL||(!window.faceapi&&state.tries>20)){el.textContent='indisponível (modo matrícula)';return}if(!window.faceapi){state.tries=(state.tries||0)+1;setTimeout(chk,300);return}el.textContent=(await Face.load())?'pronto':'indisponível (modo matrícula)'};chk()};

/* ===== TELA: login ===== */
SCR.login=()=>S.pw?`<div class="card" style="max-width:420px;margin:30px auto"><h2>🔐 Login do administrador</h2><label>Senha</label><input type="password" id="pw" autocomplete="current-password"><div class="row" style="margin-top:14px"><button class="btn" data-a="login">Entrar</button></div></div>`
:`<div class="card" style="max-width:420px;margin:30px auto"><h2>Primeiro acesso</h2><p class="mu">Crie a senha do administrador (mínimo 6 caracteres).</p><label>Nova senha</label><input type="password" id="pw1"><label>Confirmar senha</label><input type="password" id="pw2"><div class="row" style="margin-top:14px"><button class="btn" data-a="setupPw">Criar senha</button></div></div>`;
async function afterLogin(){state.admin=true;bumpIdle();await audit('LOGIN');const n=state.next;state.next=null;if(n)go(n.s,n.extra);else go('admin')}

/* ===== TELA: cadastro ===== */
function blankForm(){return{id:null,name:'',cpf:'',birth:'',wpp:'',matricula:'',status:'ativo',consent:false,photo:null,descriptor:null}}
SCR.form=()=>{const f=state.form;return `<div class="card"><div class="fgrid">
<div><label>Nome completo *</label><input data-f="name" value="${esc(f.name)}"></div>
<div><label>CPF *</label><input data-f="cpf" inputmode="numeric" value="${esc(f.cpf)}" placeholder="000.000.000-00"></div>
<div><label>Data de nascimento (opcional)</label><input type="date" data-f="birth" value="${esc(f.birth)}"></div>
<div><label>WhatsApp *</label><input data-f="wpp" inputmode="tel" value="${esc(f.wpp)}" placeholder="(11) 99999-9999"></div>
<div><label>Matrícula *</label><input data-f="matricula" value="${esc(f.matricula)}"></div>
<div><label>Status</label><select data-f="status"><option value="ativo" ${f.status==='ativo'?'selected':''}>Ativo</option><option value="inativo" ${f.status==='inativo'?'selected':''}>Inativo</option></select></div></div></div>
<div class="card"><h2>📷 Foto e cadastro facial</h2>
<div class="cam" id="camBox" style="display:none"><video id="cam" playsinline muted autoplay></video><div class="ring"></div><div class="st" id="cst">Iniciando…</div></div>
<div class="row" style="margin:12px 0"><img id="fprev" class="photo lg" src="${f.photo||''}" style="${f.photo?'':'display:none'}"><div>
<div class="row"><button class="btn" data-a="formCam">Abrir câmera</button><button class="btn sec" data-a="formCapture" id="capBtn" disabled>Capturar rosto</button></div>
<p class="mu" id="fmsg">${f.descriptor?'✅ Template facial cadastrado.':f.photo?'Foto cadastrada, sem template facial.':'Nenhuma foto capturada.'}</p></div></div></div>
<div class="card"><h2>👆 Digital</h2><p class="mu">Requer leitor biométrico externo compatível (Fase 2). Campo reservado, ainda não ativo.</p></div>
<div class="card"><label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx);font-size:14px"><input type="checkbox" data-f="consent" ${f.consent?'checked':''}> O colaborador consente com o tratamento de seus dados pessoais e biométricos para controle de jornada (LGPD).</label>
<div class="row" style="margin-top:14px"><button class="btn" data-a="formSave">💾 Salvar</button><button class="btn sec" data-a="admin">Cancelar</button></div></div>`};

/* ===== TELA: marcar ponto ===== */
SCR.punch=()=>{const P=state.punch;
if(P.phase==='scan')return `<div class="card"><div class="cam"><video id="cam" playsinline muted autoplay></video><div class="ring"></div><div class="st" id="pst">Iniciando câmera…</div></div>
<p class="mu" style="text-align:center">${S.liveness?'Olhe para a câmera e pisque para confirmar que é você.':'Olhe para a câmera.'}</p>
<div class="row" style="justify-content:center"><button class="btn sec" data-a="manual">Identificar por matrícula</button></div></div>`;
if(P.phase==='manual')return `<div class="card" style="max-width:460px;margin:0 auto"><h2>Identificação manual</h2><div class="cam" style="max-width:240px;margin-bottom:10px"><video id="cam" playsinline muted autoplay></video></div><label>Matrícula</label><input id="mMat"><label>CPF completo</label><input id="mCpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" oninput="this.value=maskCpfIn(this.value)"><div class="row" style="margin-top:14px"><button class="btn" data-a="manualGo">Continuar</button><button class="btn sec" data-a="punch">Voltar à câmera</button></div></div>`;
if(P.phase==='confirm'){const e=P.emp;return `<div class="card rec" style="max-width:520px;margin:0 auto">${P.photo?`<img class="photo lg" src="${P.photo}">`:''}<h2 style="margin-top:8px">${esc(e.name)}</h2><div class="mu">CPF: ${cpfMasked(e.cpf)} · Matrícula ${esc(e.matricula)}</div>
<div class="types">${SEQ.map(t=>`<button data-a="setType" data-t="${t}" class="${P.type===t?'on':''}">${TYPES[t]}</button>`).join('')}</div>
<div class="row" style="justify-content:center"><button class="btn" style="padding:16px 28px;font-size:18px" data-a="confirmPunch">✅ CONFIRMAR</button><button class="btn sec" data-a="punch">Cancelar</button></div><p class="mu" id="cd"></p></div>`}
const r=P.rec;return `<div class="card rec" style="max-width:520px;margin:0 auto"><div class="big-ok">✅</div><h2>${esc(r.name)}</h2><div class="mu">CPF: ${cpfMasked(r.cpf)}</div>
<div style="margin:10px 0">📅 ${fDate(new Date(r.ts))}<br><span style="font-size:34px;font-weight:700">🕐 ${r.time}</span></div><div class="tp">${TYPES[r.type].toUpperCase()}</div>
<div class="mu">Identificação: ${esc(r.method)}</div>${r.photo?`<div style="margin:10px 0">📷 <img class="photo" src="${r.photo}"></div>`:''}
<div><span class="badge wa">WhatsApp: ${esc(r.wpp)}</span></div>
<div class="row" style="justify-content:center;margin-top:14px">${r.wpp==='pendente'?'<button class="btn sec" data-a="openWpp" data-id="'+r.id+'">💬 Abrir WhatsApp</button>':''}<button class="btn" data-a="punch">Próximo colaborador</button><button class="btn sec" data-a="home">Início</button></div><p class="mu" id="cd"></p></div>`};
AFTER.punch=async()=>{const P=state.punch;if(P.phase==='confirm'){countdown(20,()=>go('punch',{punch:newPunch()}));return}if(P.phase==='done'){countdown(8,()=>go('punch',{punch:newPunch()}));return}
const v=$('#cam');if(!v)return;const r=await Cam.start(v);const st=$('#pst');const say=(m,c='')=>{const s=$('#pst');if(s){s.textContent=m;s.className='st '+c}};
if(r!==true){say(r,'warn');return}
if(P.phase==='manual')return;
say('Carregando reconhecimento facial…');P.emps=await DB.all('employees');
if(!(await Face.load())){say('Facial indisponível: '+Face.err+'. Use a matrícula.','warn');return}
if(P.phase!=='scan')return;
const tk=P.token=Date.now();let streak=0,last=null,baseline=0,closed=false,live=!S.liveness,fails=0,ymin=9,ymax=-9;
while(state.screen==='punch'&&P.token===tk&&P.phase==='scan'){
 if(v.readyState<2){await sleep(100);continue}
 let d=null;try{d=await Face.detect(v)}catch(e){}
 if(!d){say('Posicione o rosto na câmera','warn');baseline=0;closed=false;streak=0;ymin=9;ymax=-9;await sleep(120);continue}
 if(!live){const lm=d.landmarks,e=(ear(lm.getLeftEye())+ear(lm.getRightEye()))/2;baseline=Math.max(e,baseline*.99);if(e<baseline*.8)closed=true;else if(closed&&e>baseline*.9)live=true;
  const j=lm.getJawOutline(),n=lm.getNose(),y=(n[3].x-j[0].x)/(j[16].x-j[0].x);ymin=Math.min(ymin,y);ymax=Math.max(ymax,y);if(ymax-ymin>.18)live=true;
  say(live?'Prova de vida OK':'Pisque ou vire levemente a cabeça','warn');if(!live){await sleep(30);continue}}
 if(!P.emps.some(x=>x.status==='ativo'&&x.descriptor)){say('Nenhum colaborador com facial cadastrado. Use a matrícula.','warn');await sleep(800);continue}
 const m=bestMatch(Array.from(d.descriptor),P.emps);
 if(m&&m.dist<S.threshold){if(last===m.emp.id)streak++;else{last=m.emp.id;streak=1}say('Identificando… '+m.emp.name.split(' ')[0],'ok');
  if(streak>=2){await identified(m.emp,'Facial',Cam.snap(v));return}}
 else{streak=0;last=null;fails++;say((fails>8?'Não reconhecido. Tente a matrícula. ':'Rosto não reconhecido ')+(m?`(d=${m.dist.toFixed(2)}, limite ${S.threshold})`:''),'warn')}
 await sleep(80)}};
function newPunch(){return{phase:'scan',token:0,emps:[]}}
function countdown(n,fn){const P=state.punch,ph=P.phase;const el=()=>$('#cd');const t=setInterval(()=>{if(state.screen!=='punch'||P.phase!==ph){clearInterval(t);return}n--;if(el())el().textContent=`Retornando em ${n}s`;if(n<=0){clearInterval(t);fn()}},1000)}
async function suggestType(emp){const ps=(await DB.all('punches')).filter(p=>p.empId===emp.id).sort((a,b)=>a.ts<b.ts?1:-1);const l=ps[0];if(!l||Date.now()-new Date(l.ts)>14*3600e3||l.type==='SAIDA')return 'ENTRADA';return SEQ[SEQ.indexOf(l.type)+1]||'SAIDA'}
async function identified(emp,method,photo){const P=state.punch;Cam.stop();P.emp=emp;P.method=method;P.photo=photo;P.type=await suggestType(emp);P.phase='confirm';render()}

async function registerPunch(){const P=state.punch,e=P.emp,now=new Date();
const all=(await DB.all('punches')).sort((a,b)=>a.ts<b.ts?-1:1);
const mine=all.filter(p=>p.empId===e.id);if(mine.length&&now-new Date(mine[mine.length-1].ts)<60000){toast('Já existe marcação há menos de 1 minuto.',1);return}
const prev=all.length?all[all.length-1].hash:'GENESIS';
const rec={id:uid(),empId:e.id,name:e.name,matricula:e.matricula,cpf:e.cpf,ts:now.toISOString(),date:dKey(now),time:fTime(now),type:P.type,method:P.method,photo:P.photo,device:S.device,wpp:'pendente',prevHash:prev};
rec.hash=await sha([prev,rec.id,rec.empId,rec.ts,rec.type,rec.method].join('|'));
const msg=`Olá, ${e.name.split(' ')[0]}! ${WMSG[rec.type]}\n📅 ${fDate(now)} 🕐 ${rec.time}\n${S.company}`;
if(!digits(e.wpp))rec.wpp='sem número';
else if(S.webhook){try{const r=await fetch(S.webhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:'55'+digits(e.wpp),message:msg,punchId:rec.id})});rec.wpp=r.ok?'enviado':'falha'}catch(x){rec.wpp='falha'}}
await DB.put('punches',rec);await audit('PONTO',`${e.name} · ${rec.type}`);P.rec=rec;P.phase='done';render()}
function wppLink(rec,emp){const msg=`Olá, ${rec.name.split(' ')[0]}! ${WMSG[rec.type]}\n📅 ${fDate(new Date(rec.ts))} 🕐 ${rec.time}\n${S.company}`;return `https://wa.me/55${digits(emp?emp.wpp:'')}?text=${encodeURIComponent(msg)}`}

};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.classList.contains('modal')&&e.target!==b)return;bumpIdle();ACT[b.dataset.a]?.(b,e)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.f;if(!k||!state.form)return;if(t.type==='checkbox'){state.form[k]=t.checked;return}let v=t.value;if(k==='cpf')v=t.value=maskCpfIn(v);if(k==='wpp')v=t.value=maskWppIn(v);state.form[k]=v});
document.addEventListener('change',async e=>{if(e.target.id==='bkFile'){const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.employees||!d.punches)throw 0;for(const s of['employees','punches','audit'])await DB.clear(s);for(const x of d.employees)await DB.put('employees',x);for(const x of d.punches)await DB.put('punches',x);for(const x of d.audit||[])await DB.put('audit',x);await audit('BACKUP_IMPORT');toast('Backup importado');render()}catch(x){toast('Arquivo inválido',1)}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&state.screen==='login')ACT[S.pw?'login':'setupPw']()});

/* ===== boot ===== */
(async()=>{await DB.open();await loadSettings();render()})();
// PWA: instalável (requer HTTPS) + tela sempre ligada na marcação
try{const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0f766e"/><circle cx="256" cy="256" r="150" fill="none" stroke="#fff" stroke-width="28"/><path d="M256 160v100l66 40" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round"/></svg>`;const ic='data:image/svg+xml;base64,'+btoa(svg);
const mf={name:'Controle de Ponto',short_name:'Ponto',display:'standalone',orientation:'any',background_color:'#f1f5f9',theme_color:'#0f766e',start_url:location.href.split('#')[0],icons:[{src:ic,sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));document.head.appendChild(l);
const a=document.createElement('link');a.rel='apple-touch-icon';a.href=ic;document.head.appendChild(a)}catch(e){}
let wl=null;async function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible'&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',keepAwake);document.addEventListener('click',keepAwake,{once:true});
// histórico: carrega dados ao entrar
const _go=go;go=function(s,extra={}){if(s==='hist'){const h=extra.hist||newHist();state.hist=h;histLoad().then(()=>_go(s,extra))}else _go(s,extra)};
